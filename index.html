<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Activity</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intro.js@8.5.0/minified/introjs.min.css" />
    <link rel="stylesheet" href="styles.css?v=2026.10.14.3" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/intro.js@8.5.0/minified/intro.min.js"></script>
</head>
<body>
    <div class="app-version-badge">v2026.10.14.3</div>
    <header class="topbar" id="appHeader"></header>

    <main class="app-shell">
        <div class="quiz-tools" aria-label="Quiz tools">
            <button class="step-chip ai-status-chip" id="offlineAiStatus" type="button" aria-expanded="false" aria-controls="offlineAiDetails">Offline AI loading</button>
            <div class="ai-details-popover" id="offlineAiDetails" hidden></div>
            <button class="btn" id="resetBtn" hidden>Exit Quiz</button>
        </div>
        <section class="panel" id="dashboardView" hidden>
            <div class="section-title"><div><h2 id="dashboardWelcome">Welcome</h2><p id="dashboardSection"></p></div><button class="btn" id="refreshSessionsBtn">Refresh</button></div>
            <h3>Recent Quiz Sessions</h3>
            <p>Choose a quiz session to begin.</p>
            <div id="sessionList" class="session-list" aria-live="polite"></div>
        </section>

        <section class="panel setup-panel" id="setupView" hidden>
            <div class="section-title">
                <div>
                    <h2 id="welcomeTitle">Welcome</h2>
                    <p id="classroomLabel"></p>
                </div>
                <span class="step-chip">Step 2</span>
            </div>
            <div class="form-grid" id="quizFilterControls">
                <fieldset class="setup-group" id="quizFiltersGroup">
                    <legend>Filters</legend>
                    <label class="field" id="classFilterField">
                        <span>Class *</span>
                        <select id="classFilter" required>
                            <option value="">Select class</option>
                        </select>
                    </label>
                    <label class="field" id="subjectFilterField" hidden>
                        <span>Subject</span>
                        <select id="subjectFilter">
                            <option value="">Select subject</option>
                        </select>
                    </label>
                    <label class="field" id="chapterFilterField" hidden>
                        <span>Chapter</span>
                        <select id="chapterFilter">
                            <option value="">Select chapter</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>Difficulty</span>
                        <select id="difficultyFilter">
                            <option value="">Any</option>
                            <option>Easy</option>
                            <option>Medium</option>
                            <option>Hard</option>
                            <option>Very Hard</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>Question Count</span>
                        <input id="questionCountInput" type="number" min="1" value="10" />
                    </label>
                    <fieldset class="field checkbox-group-field">
                        <legend>Question Types</legend>
                        <label class="checkbox-field">
                            <input class="question-type-filter" type="checkbox" value="mcq" checked />
                            <span>MCQ</span>
                        </label>
                        <label class="checkbox-field">
                            <input class="question-type-filter" type="checkbox" value="true_false" checked />
                            <span>True/False</span>
                        </label>
                        <label class="checkbox-field">
                            <input class="question-type-filter" type="checkbox" value="fib" checked />
                            <span>Fill in the Blank</span>
                        </label>
                        <label class="checkbox-field">
                            <input class="question-type-filter" type="checkbox" value="short_answer" checked />
                            <span>Short Answer</span>
                        </label>
                    </fieldset>
                    <label class="field checkbox-field">
                        <input id="explanationOnlyFilter" type="checkbox" />
                        <span>Only questions with explanation</span>
                    </label>
                    <label class="field checkbox-field">
                        <input id="translationOnlyFilter" type="checkbox" />
                        <span>Only questions with translations</span>
                    </label>
                    <label class="field checkbox-field">
                        <input id="verifiedOnlyFilter" type="checkbox" checked />
                        <span>Only staff verified questions</span>
                    </label>
                </fieldset>
                <fieldset class="setup-group" id="quizSettingsGroup">
                    <legend>Quiz Settings</legend>
                    <label class="field checkbox-field">
                        <input id="instantFeedbackFilter" type="checkbox" checked />
                        <span>Instant feedback after each question</span>
                    </label>
                    <label class="field checkbox-field">
                        <input id="speakerButtonFilter" type="checkbox" checked />
                        <span>Show speaker before question text</span>
                    </label>
                    <label class="field checkbox-field">
                        <input id="listenRespondFilter" type="checkbox" />
                        <span>Listen and respond</span>
                    </label>
                    <label class="field checkbox-field">
                        <input id="fibChoiceBankFilter" type="checkbox" checked />
                        <span>Clickable answer bank for multi-blank fill in the blanks</span>
                    </label>
                    <label class="field checkbox-field">
                        <input id="shortAnswerWordBankFilter" type="checkbox" checked />
                        <span>Clickable word bank for short answers</span>
                    </label>
                    <label class="field checkbox-field">
                        <input id="translatedShortAnswerFilter" type="checkbox" checked />
                        <span>Option to view translated short answer</span>
                    </label>
                    <label class="field">
                        <span>Voice</span>
                        <select id="voiceSelect">
                            <option value="">System default</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>Speed <strong id="voiceRateValue">1.0x</strong></span>
                        <input id="voiceRateInput" type="range" min="0.6" max="1.4" step="0.1" value="1" />
                    </label>
                </fieldset>
            </div>
            <div class="quiz-summary" id="questionLoadSummary">Load questions to see availability.</div>
            <div class="actions">
                <button class="btn" id="loadQuestionsBtn">Load Questions</button>
                <button class="btn primary" id="startQuizBtn" disabled>Start Quiz</button>
            </div>
        </section>

        <section class="quiz-layout" id="quizView" hidden>
            <aside class="panel nav-panel">
                <div class="section-title">
                    <h2>Questions</h2>
                    <span id="timerLabel" class="step-chip">Live</span>
                </div>
                <div class="quiz-summary" id="progressSummary"></div>
                <details class="selection-memory-panel" id="selectionMemoryPanel" hidden>
                    <summary>AI question selection memory</summary>
                    <div id="selectionMemoryDetails"></div>
                </details>
            </aside>
            <section class="panel quiz-panel" id="quizPanel">
                <div class="explanation-frame-panel" id="explanationFramePanel" hidden>
                    <div class="review-head">
                        <strong>Topic Explanation</strong>
                        <a class="btn small-btn" id="explanationOpenLink" href="#" target="_blank" rel="noopener noreferrer">Open</a>
                    </div>
                    <iframe id="explanationFrame" title="Topic explanation"></iframe>
                </div>
                <div class="question-work-panel">
                    <div class="question-head">
                        <div>
                            <span id="questionMeta" class="meta-line"></span>
                            <h2 id="questionTitle"></h2>
                        </div>
                        <span id="questionTypeLabel" class="step-chip"></span>
                    </div>
                    <div class="question-audio-controls" id="questionAudioControls" hidden></div>
                    <div id="questionPrompt" class="rich-content"></div>
                    <div id="answerArea" class="answer-area"></div>
                    <div id="instantFeedbackPanel" class="instant-feedback-panel" hidden></div>
                    <div class="actions spread">
                        <button class="btn primary" id="nextQuestionBtn">Next</button>
                    </div>
                </div>
            </section>
        </section>

        <section class="panel result-panel" id="resultView" hidden>
            <div class="section-title">
                <div>
                    <h2>Submission Complete</h2>
                    <p id="resultSummary"></p>
                </div>
                <span class="step-chip">Submitted</span>
            </div>
            <div id="reviewList" class="review-list"></div>
        </section>
    </main>

    <div id="toast" class="toast"></div>
    <script type="module" src="app.js?v=2026.10.14.3"></script>
</body>
</html>
