<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Past Submissions | Quiz Activity</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <link rel="stylesheet" href="styles.css?v=2026.09.25.4" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
</head>
<body>
    <div class="app-version-badge">v2026.09.25.4</div>
    <header class="topbar">
        <div>
            <h1>Past Submissions</h1>
            <p id="historyStatusText">Loading submission history...</p>
        </div>
        <div class="topbar-actions">
            <a class="btn" href="index.html?v=2026.09.25.4">Back to Quiz</a>
        </div>
    </header>

    <main class="app-shell">
        <section class="panel history-panel">
            <div class="section-title">
                <div>
                    <h2 id="historyStudentName">Student</h2>
                    <p id="historyClassroomLabel"></p>
                </div>
                <span class="step-chip">Newest First</span>
            </div>
            <div id="studentReport" class="student-report"></div>
            <div id="historyList" class="history-list"></div>
        </section>
    </main>

    <div id="toast" class="toast"></div>
    <script type="module" src="submissions.js?v=2026.09.25.4"></script>
</body>
</html>
