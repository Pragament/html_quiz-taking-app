<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Login | Quiz Activity</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intro.js@8.5.0/minified/introjs.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/intro.js@8.5.0/minified/intro.min.js"></script>
    <link rel="stylesheet" href="styles.css?v=2026.10.14.6" />
</head>
<body>
    <div class="app-version-badge">v2026.10.14.6</div>
    <header class="topbar"><div><h1>Quiz Activity</h1><p id="loginStatus" aria-live="polite">Checking sign-in...</p></div><button class="btn" id="tourBtn" type="button">Tour</button></header>
    <main class="app-shell">
        <section class="panel login-panel" id="loginView">
            <div class="section-title">
                <h2>Student Login</h2>
                <span class="step-chip">Step 1</span>
            </div>
            <form id="loginForm">
                <div class="form-grid">
                    <label class="field"><span>Student Email</span><input id="emailInput" type="email" autocomplete="username" required placeholder="student@school.edu" /></label>
                    <label class="field">
                        <span>Password</span>
                        <div class="password-field">
                            <input id="passwordInput" type="password" autocomplete="current-password" required placeholder="Enter password" />
                            <button class="btn small-btn" id="togglePasswordBtn" type="button" aria-controls="passwordInput" aria-pressed="false">Show</button>
                        </div>
                    </label>
                </div>
                <div class="actions"><button class="btn primary" id="verifyBtn" type="submit" disabled>Sign In</button></div>
            </form>
            <div class="error-box" id="loginError" role="alert" hidden></div>
        </section>

    </main>
    <script type="module" src="login.js?v=2026.10.14.6"></script>
</body>
</html>
